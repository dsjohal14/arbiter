name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - name: ruff check
        run: uvx ruff check src/ tests/
      - name: ruff format
        run: uvx ruff format --check src/ tests/

  test:
    runs-on: ${{ matrix.os }}
    # A tool whose whole problem is hanging subprocesses must not be able to
    # hang its own CI.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - name: Install
        run: uv pip install --system -e . pytest pytest-asyncio pytest-cov
      - name: Test
        run: pytest tests/ --cov=arbiter --cov-report=term-missing --cov-fail-under=80
